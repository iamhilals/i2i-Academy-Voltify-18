# Sunucu Portu
server.port=8080

# PostgreSQL Veritabanı Bağlantı Ayarları
spring.datasource.url=jdbc:postgresql://localhost:5434/voltifydb
spring.datasource.username=voltify_user
spring.datasource.password=voltify_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA) Ayarları - Tabloları otomatik oluşturması için[cite: 1]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Apache Kafka Ayarları
spring.kafka.bootstrap-servers=localhost:9092

# Tüketici (Consumer) Ayarları - Mesajları okuyacak grubun adı
spring.kafka.consumer.group-id=voltify-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Üretici (Producer) Ayarları - Mesajları gönderecek yapı
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Listener - Topic henüz yaratılmadıysa hata verme
spring.kafka.listener.missing-topics-fatal=false

# JWT Ayarları
jwt.secret=${JWT_SECRET:voltify-super-secret-key-must-be-at-least-32-characters-long}